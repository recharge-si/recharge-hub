# Shopify app configuration. This is the single active config.
#
# The Shopify CLI rewrites parts of this file on `dev`. If `scopes` comes back
# empty or the webhook api_version changes, it pulled the remote app's config
# over the top: restore the values below and run `npm run deploy`.

client_id = "77a669bae44e293ff5b59dc85783bc71"
name = "mk-sync"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# CLAUDE.md section 2.3: minimum necessary, every scope justified.
#   read_products, write_products                     product sync, MetaKocka to Shopify
#   read_inventory, write_inventory                   read levels everywhere, write on-hand for own locations only
#   read_locations                                    map Shopify locations to supply sources
#   read_orders                                       order intake
#   read/write_merchant_managed_fulfillment_orders    move and split fulfilment orders
#
# read_all_orders is deliberately absent: nothing needs orders older than 60 days.
#
# The CLI has cleared this twice by pulling the remote app's config, which was
# created empty. Run `npm run deploy` once so the remote app carries these too,
# otherwise the next `dev` can wipe them again.
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,read_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"

# Token exchange, not the legacy OAuth redirect flow (CLAUDE.md section 2.2).
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
