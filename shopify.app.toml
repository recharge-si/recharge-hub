# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c8278acae8662c0630fa3ece20955d05"
name = "Recharge Hub"
# Public origin of the deployed web process (Caddy, docs/development.md
# § Production Compose). Must equal SHOPIFY_APP_URL and APP_DOMAIN on the
# server. Run `npm run deploy` after changing it so the webhook subscriptions
# are re-registered against the new origin.
application_url = "https://recharge-hub.time-4-action.com"
embedded = true

[build]
# This config points at the live store. `shopify app dev` must never overwrite
# its URLs with a tunnel; use a separate Partner app for local development
# (docs/development.md § Local development against a separate app).
automatically_update_urls_on_dev = false

[webhooks]
# Must equal API_VERSION in src/adapters/shopify/shopify.server.ts, which is
# what the Admin client speaks. `tests/unit/api-version.test.ts` fails if the
# two drift. This read "2026-10" — a version the installed SDK does not have —
# so webhooks were registered against one Admin API and read with another.
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Order intake (section 8.1). The handler writes the order and queues its
  # allocation in one transaction, then answers 200 well inside the five-second
  # budget.
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  # An order is not a fact that arrives once (section 8.7). It is paid an hour
  # later, edited the next morning, refunded on Friday, and without these the
  # app hears none of it: an order that came in unpaid stays unpaid in the ERP
  # for good. orders/updated is the broad signal; orders/paid is deliberately
  # redundant with it, because that is the one event that moves money.
  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/orders/updated"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  # Not implemented in v1 (section 8.8), but received from day one and turned
  # into exceptions so nothing is lost silently.
  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/refunds/create"

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled" ]
  uri = "/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = [ "orders/edited" ]
  uri = "/webhooks/orders/edited"

  # Deleted in Shopify, kept in MetaKocka: the ERP document is the accounting
  # record and may already be invoiced. The order is hidden from this app only.
  [[webhooks.subscriptions]]
  topics = [ "orders/delete" ]
  uri = "/webhooks/orders/delete"

  # Sale campaigns (docs/sale-campaigns.md). A product's price changing
  # under an active campaign — an ERP sync, a person in the admin — is
  # detected from here, and a product joining or leaving a dynamic campaign
  # is noticed from here. The app's own price writes come back through this
  # topic too and are recognised as its own.
  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = [ "products/delete" ]
  uri = "/webhooks/products/delete"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# `read_discounts` is for one warning only: a sale campaign's preview names
# the automatic discounts Shopify would apply at checkout on top of the
# catalogue price (docs/sale-campaigns.md § Required scopes). Until the
# merchant approves it the preview says "not checked" and nothing else changes.
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,read_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_discounts"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://recharge-hub.time-4-action.com/auth/callback",
  "https://recharge-hub.time-4-action.com/auth/shopify/callback",
  "https://recharge-hub.time-4-action.com/api/auth/callback"
]
