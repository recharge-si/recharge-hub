# Host nginx in front of the Compose stack (docs/development.md § Server).
# Install as /etc/nginx/conf.d/recharge-hub.conf after obtaining the
# certificate; WEB_PORT in .env must match the upstream port below.
#
# Shopify embeds the app in an iframe and the app sets its own
# Content-Security-Policy frame-ancestors per request, so this file must not
# add X-Frame-Options or a CSP of its own.

upstream recharge_hub {
    server 127.0.0.1:3192;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name recharge-hub.time-4-action.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` is the pre-1.25 form; it still works on newer nginx.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name recharge-hub.time-4-action.com;

    ssl_certificate     /etc/letsencrypt/live/recharge-hub.time-4-action.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recharge-hub.time-4-action.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Shopify webhook payloads and the admin UI are small; this only guards
    # against abuse.
    client_max_body_size 5m;

    access_log /var/log/nginx/recharge-hub.access.log;
    error_log  /var/log/nginx/recharge-hub.error.log;

    location = /healthz {
        access_log off;
        proxy_pass http://recharge_hub;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://recharge_hub;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
