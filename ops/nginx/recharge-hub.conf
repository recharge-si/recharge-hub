# Host nginx in front of the Compose stack (docs/development.md § Server).
# Install as /etc/nginx/conf.d/recharge-hub.conf. Follows the same shape as
# the other *.time-4-action.com sites: TLS comes from the shared
# /etc/nginx/snippets/ssl-t4a.conf snippet, and WEB_PORT in .env must match
# the upstream port below.
#
# Shopify embeds the app in an iframe and the app sets its own
# Content-Security-Policy frame-ancestors per request, so this file must not
# add X-Frame-Options or a CSP of its own.

# recharge-hub.time-4-action.com → :3192
server {
    listen 80;
    server_name recharge-hub.time-4-action.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name recharge-hub.time-4-action.com;
    include /etc/nginx/snippets/ssl-t4a.conf;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3192;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/recharge-hub.time-4-action.com.access.log;
    error_log  /var/log/nginx/recharge-hub.time-4-action.com.error.log;
}
