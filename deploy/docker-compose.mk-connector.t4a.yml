# Production compose for /srv/mk-connector on t4a: the T4A MetaKocka Connector,
# the same image as Recharge Hub run for another store with only the MetaKocka
# part (docs/development.md § Another store). Save it there as
# docker-compose.yml, next to .env. CI exports APP_IMAGE when /srv/mk-connector
# is listed in the DEPLOY_DIRS variable; the server never builds.
#
# Differences from deploy/docker-compose.t4a.yml (Recharge):
# - its own project name, Traefik router and domain;
# - web on loopback 3193 (CI asks Compose for the port);
# - no claude-pool mount: the rig builder is Recharge-only.
# The database is its own one on t4a's shared Postgres (new-app-db.sh
# mk-connector); DATABASE_URL comes from .env.
name: mk-connector

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/recharge-si/recharge-hub:latest}
  env_file: .env
  environment:
    NODE_ENV: production
  networks:
    - db
  logging:
    options:
      max-size: 10m
      max-file: "3"
  restart: unless-stopped

services:
  migrate:
    <<: *app
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  web:
    <<: *app
    command: ["npm", "run", "start"]
    ports:
      - "127.0.0.1:3193:3000"
    mem_limit: 1g
    networks:
      - db
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.mk-connector.rule=Host(`mk-connector.time-4-action.com`)
      - traefik.http.services.mk-connector.loadbalancer.server.port=3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["npm", "run", "start:worker"]
    mem_limit: 1g
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  db:
    external: true
  edge:
    external: true
