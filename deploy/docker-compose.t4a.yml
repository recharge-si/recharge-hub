# Production compose for /srv/recharge-hub on t4a (Hetzner; time-4-action/t4a-infra, servers/t4a).
# Save it there as docker-compose.yml, next to .env. CI exports APP_IMAGE (the image it built,
# .github/workflows/deploy.yml with DEPLOY_DIR=/srv/recharge-hub on the `production` environment);
# without it this runs :latest. The server never builds; copy changes to this file by hand.
#
# Differences from the root docker-compose.yml (which bundles its own Postgres):
# - The database is t4a's shared Postgres 18 (/srv/postgres; nightly pgBackRest backups). DATABASE_URL
#   comes from .env (postgres://recharge-hub:...@postgres:5432/recharge-hub?schema=public, made by
#   new-app-db.sh), so there is no postgres service and no DATABASE_URL override here.
# - Traefik (/srv/edge) routes recharge-hub.time-4-action.com to web, behind Cloudflare. web still
#   publishes 127.0.0.1:3192 for CI's health check; Docker-published ports skip ufw, so never 0.0.0.0.
name: recharge-hub

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/recharge-si/recharge-hub:latest}
  env_file: .env
  environment:
    NODE_ENV: production
  networks:
    - db
  logging:
    options:
      max-size: 10m
      max-file: "3"
  restart: unless-stopped

services:
  # One-shot. Running migrations from exactly one place keeps two containers from
  # racing each other on startup.
  migrate:
    <<: *app
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  web:
    <<: *app
    command: ["npm", "run", "start"]
    environment:
      NODE_ENV: production
      # The rig builder's explanations go through claude-pool (docs/rig-builder.md § Image). The
      # account directory is a read-only secret mount; claude-pool keeps its usage state on the
      # writable volume below.
      CLAUDE_POOL_DIR: /run/claude-pool
      CLAUDE_POOL_STATE: /var/lib/claude-pool/state.json
      CLAUDE_POOL_LOG: /var/lib/claude-pool/log
    volumes:
      - ${CLAUDE_POOL_DIR_HOST:-./data/claude-pool}:/run/claude-pool:ro
      - claude-pool-state:/var/lib/claude-pool
    ports:
      - "127.0.0.1:3192:3000"
    mem_limit: 1g
    networks:
      - db
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.recharge-hub.rule=Host(`recharge-hub.time-4-action.com`)
      - traefik.http.services.recharge-hub.loadbalancer.server.port=3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["npm", "run", "start:worker"]
    mem_limit: 1g
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  claude-pool-state:

networks:
  db:
    external: true
  edge:
    external: true
