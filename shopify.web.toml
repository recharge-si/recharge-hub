# Tells the Shopify CLI that this app has a web process to run and tunnel.
#
# Without this file the CLI treats the project as extension-only: it starts no
# server, never rewrites `application_url`, and the admin shows Shopify's
# "Find this app in the pages where you work" placeholder instead of the app.
#
# The worker starts alongside the web server. They stay two processes
# (CLAUDE.md section 4) and Docker runs them as two containers, but in
# development both have to be up or every sync button silently queues a job
# that nothing ever picks up. scripts/dev.mjs runs the pair.
#
# There is no `predev = "prisma generate"` on purpose. Generating rewrites
# query_engine-windows.dll.node, and on Windows that fails with EPERM whenever
# any other process still has the engine loaded, which takes the whole dev
# session down. Generation belongs to `postinstall` in package.json, and to
# `npm run setup` after a schema change.

name = "web"
roles = ["frontend", "backend"]

[commands]
dev = "npm exec prisma migrate deploy && node scripts/dev.mjs"
