# docs/BUILD_SPEC.md section 4: Docker Compose on one Linux VM.
# `docker compose up` brings up a working system in one command (section 12).
#
# All persistent state lives under ./data next to this file (the database and
# Caddy's certificates), so backing up or moving the deployment is a matter of
# copying the checkout directory. The `Z` mount option relabels the directories
# for SELinux, which AlmaLinux/RHEL enforce by default; without it Postgres
# cannot write its own data directory. It is a no-op where SELinux is absent.

name: recharge-hub

x-app: &app
  # Built and pushed from a workstation with scripts/build-and-push.bat; the
  # server only pulls. The app VM does not have the memory to run a Vite build
  # alongside PostgreSQL, so there is deliberately no `build:` here.
  image: ${APP_IMAGE:-time4action/recharge-hub:latest}
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-recharge_hub}:${POSTGRES_PASSWORD:-recharge_hub}@postgres:5432/${POSTGRES_DB:-recharge_hub}?schema=public
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recharge_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recharge_hub}
      POSTGRES_DB: ${POSTGRES_DB:-recharge_hub}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:Z
    ports:
      # Bound to loopback so `npm run dev` on the host can reach it. Not exposed
      # off the machine, in production or anywhere else.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recharge_hub} -d ${POSTGRES_DB:-recharge_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot. Running migrations from exactly one place keeps two containers from
  # racing each other on startup.
  migrate:
    <<: *app
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    command: ["npm", "run", "start"]
    expose:
      - "3192"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["npm", "run", "start:worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    # Opt-in: `docker compose --profile caddy up -d` on a VM where nothing else
    # owns ports 80/443. With a host nginx, leave it off.
    profiles: ["caddy"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./data/caddy/data:/data:Z
      - ./data/caddy/config:/config:Z
    depends_on:
      - web
    restart: unless-stopped
