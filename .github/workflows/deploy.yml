# check + e2e -> deploy -> verify.
#
# Checks every pull request and every push to main, and runs the end-to-end
# suite beside the check. On main, a green check and e2e run
# builds the image, pushes it to GHCR tagged with the commit SHA and
# `latest`, and rolls the production stack onto that exact SHA over SSH, rolling
# back to the previous image if it does not come up healthy on that commit.
# `verify` then checks the public URL through nginx. The VM only pulls; see
# docs/development.md "Continuous deployment".
name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request supersedes the running check. On main
# runs are never cancelled, only queued: one push is checked and deployed
# before the next starts, so an older commit can never be deployed over a newer
# one. Concurrency groups are repository-wide, so the workflow name keeps this
# one from colliding with a group in any other workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/recharge-si/recharge-hub
  # Overridable with the PRODUCTION_URL repository variable.
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://recharge-hub.time-4-action.com' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A throwaway database, so tests/db/ runs against migrations exactly as
    # production applies them instead of skipping itself.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm test
      # The same build the Dockerfile runs, so a broken build fails the pull
      # request rather than the deploy.
      - run: npm run build

  # The e2e build in a real browser against the fake Shopify and MetaKocka
  # (docs/development.md "End-to-end tests"). Its own database, because every
  # e2e run migrates and writes to it; the report is kept whether it passes or
  # not, and holds a trace and screenshot for every failure.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The PROD_DEPLOY_* SSH secrets are organization secrets. GHCR needs none:
    # the job's own GITHUB_TOKEN pushes the image and lets the VM pull it.
    environment: production
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          # Baked in as APP_VERSION, which the server checks after rollout.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_DEPLOY_FINGERPRINT }}
          timeout: 30s
          command_timeout: 15m
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -u
            cd /data/stack/apps/recharge-hub || exit 1
            SHA=${{ github.sha }}
            NEW=${{ env.IMAGE }}:$SHA

            # The image web runs now is what a failed deploy goes back to.
            PREV=""
            WEB_ID=$(docker compose ps -q web 2>/dev/null || true)
            if [ -n "$WEB_ID" ]; then
              PREV=$(docker inspect --format '{{.Config.Image}}' "$WEB_ID")
            fi
            echo "running: ${PREV:-nothing}  deploying: $NEW"

            healthy() {
              for i in $(seq 1 30); do
                curl -fsS http://127.0.0.1:3192/healthz >/dev/null && return 0
                sleep 2
              done
              return 1
            }

            # Healthy is not enough: web and worker must both be running the
            # image built from this commit, not a container left over.
            on_commit() {
              WEB_SHA=$(docker compose exec -T web printenv APP_VERSION 2>/dev/null || true)
              echo "web reports APP_VERSION=${WEB_SHA:-none}"
              [ "$WEB_SHA" = "$SHA" ] || return 1
              WORKER_ID=$(docker compose ps -q --status running worker 2>/dev/null || true)
              [ -n "$WORKER_ID" ] || { echo "worker is not running"; return 1; }
              WORKER_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$WORKER_ID")
              [ "$WORKER_IMAGE" = "$NEW" ] || { echo "worker is on $WORKER_IMAGE"; return 1; }
            }

            # The pull logs in with this job's GITHUB_TOKEN, which expires when
            # the job ends, and logs out again on every exit: the VM keeps no
            # registry credential. Rollback needs none, the previous image is local.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null || exit 1

            export APP_IMAGE=$NEW
            # A failed pull changes nothing on the server. Retried, because
            # registries have transient failures.
            for i in 1 2 3; do
              docker compose pull migrate web worker && break
              [ "$i" = 3 ] && exit 1
              echo "pull failed, retrying"; sleep 10
            done

            if docker compose up -d --remove-orphans && healthy && on_commit; then
              echo "healthy on $NEW"
              exit 0
            fi

            echo "deploy of $NEW failed"
            docker compose logs --tail=50 migrate web

            if [ -z "$PREV" ] || [ "$PREV" = "$NEW" ]; then
              echo "no previous image to roll back to"
              exit 1
            fi

            # --no-deps skips migrate: a migration that already ran stays
            # applied, and a failed one would only fail again.
            echo "rolling back to $PREV"
            export APP_IMAGE=$PREV
            if docker compose up -d --no-deps web worker && healthy; then
              echo "rolled back to $PREV"
            else
              echo "rollback is not healthy either"
              docker compose logs --tail=50 web
            fi
            exit 1

  # From outside: DNS, TLS and the host nginx in front of the container the
  # deploy job already checked on loopback.
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Public health check
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 \
            "$PRODUCTION_URL/healthz"
